name: Daily Job Market Pipeline

on:
  schedule:
    - cron: "0 14 * * *"   # 14:00 UTC = 7:00 AM PST / 10:00 AM EST
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write   # drift check opens an issue when history is rewritten

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download existing DB from R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python scripts/download_db.py

      - name: Snapshot yesterday's DB (for the drift check)
        run: |
          if [ -f data/job_market.duckdb ]; then
            cp data/job_market.duckdb "$RUNNER_TEMP/yesterday.duckdb"
          else
            echo "No previous database (first run): drift check will be skipped"
          fi

      - name: Run pipeline
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python run_pipeline.py

      - name: Data drift check (neon-data-diff)
        id: drift
        continue-on-error: true   # report only: never blocks the upload
        run: |
          if [ ! -f "$RUNNER_TEMP/yesterday.duckdb" ]; then echo "skipped: no snapshot"; exit 0; fi
          pip install "neon-data-diff[duckdb] @ git+https://github.com/evgeniimatveev/neon-data-diff@v0.2.0"
          set +e
          neon-data-diff             --duckdb-base "$RUNNER_TEMP/yesterday.duckdb" --duckdb-head data/job_market.duckdb             --key job_market_history=run_id,tech_stack,location --key pipeline_runs=run_id             --base-label yesterday --head-label today --title "Data drift"             --max-rewrite-pct 0 --markdown "$RUNNER_TEMP/drift.md"
          rc=$?
          [ -f "$RUNNER_TEMP/drift.md" ] && cat "$RUNNER_TEMP/drift.md" >> "$GITHUB_STEP_SUMMARY"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit $rc

      - name: Open an issue if history was rewritten
        if: steps.drift.outputs.rc == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Data drift on $(date -u +%F)" --body-file "$RUNNER_TEMP/drift.md"

      - name: Update README with today's market stats
        run: python scripts/update_readme.py

      - name: Upload updated DB to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python scripts/upload_db.py

      - name: Commit updated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "auto: market report $(date -u '+%Y-%m-%d')"
          git push
